name: Engineering-content proposal
description: Propose a lane, discipline, addendum, template, catalog, or doctrine change.
title: "content: "
body:
  - type: dropdown
    id: surface
    attributes:
      label: Proposed authority surface
      options:
        - Language lane
        - Conditional lane addendum
        - Cross-language discipline
        - Template or profile
        - Catalog metadata
        - Repo-local guidance instead of shared doctrine
        - Unsure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Repeated problem
      description: Describe the recurring risk, inconsistency, or decision cost. Name affected repo shapes or users.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and examples
      description: Provide non-sensitive observations, measurements, incidents, or consumer needs. Distinguish direct observation from inference and model-generated analysis.
    validations:
      required: true
  - type: textarea
    id: evidence_refs
    attributes:
      label: Evidence references
      description: Optional agent-kernel evidence/receipt/artifact IDs or equivalent digest-bound artifact references. Include producer/schema, stable subject, immutable revision, optional configuration reference, digest, scope, capture time, and authority ceiling where available; do not paste private payloads.
  - type: textarea
    id: telemetry_review
    attributes:
      label: Telemetry review policy
      description: When telemetry is used, identify the pi.telemetry-review-snapshot.v1 digest, subject/revision, metric and sample domain, baseline/review windows, minimum sample size, coverage policy, minimum live count, threshold/comparison, and coverage limitations. Leave blank when telemetry is not relevant.
  - type: textarea
    id: invariant
    attributes:
      label: Proposed invariant or decision rule
      description: State what must remain true without overfitting to one tool or repository.
    validations:
      required: true
  - type: textarea
    id: triggers
    attributes:
      label: Load triggers and non-goals
      description: When should this guidance be loaded, and when should it not apply?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Competing guidance and counterevidence
      description: Include the strongest alternative, known exceptions, and evidence that points against the proposal.
    validations:
      required: true
  - type: textarea
    id: falsification_review
    attributes:
      label: Falsification, review, and retirement
      description: Name observable results that would revise or reject the rule, the event/date that triggers review, and the conditions that should deprecate, merge, or retire it.
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: Shared semantic references
      description: Optional accepted ontology-kernel IDs used by more than one system, or candidate terms that need a separate ontology proposal. Keep protocol-specific states in their owning schema.
  - type: textarea
    id: adoption
    attributes:
      label: Pilot, adoption, compatibility, and rollback
      description: Explain bounded pilot scope or stable-promotion evidence, migration, catalog/schema impact, consumer cost, and rollback. A KES candidate starts at Proposal and does not authorize this transition.
    validations:
      required: true
