name: Validate manually pushed release tag

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: engineering-core-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv and project
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --locked
      - name: Verify tag, main ancestry, and artifacts
        run: |
          git fetch origin main --tags
          uv run python scripts/check-release-lineage.py \
            --mode release \
            --tag "$GITHUB_REF_NAME" \
            --main-ref origin/main
          uv run python scripts/release-local.py verify
      - name: Create release when absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME is already released."
            exit 0
          fi
          version=${GITHUB_REF_NAME#v}
          notes=$(find docs/releases -maxdepth 1 -name "*-v${version}-local-release.md" -print -quit)
          test -n "$notes"
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl dist/*.tar.gz \
            --title "engineering-core $GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --verify-tag
