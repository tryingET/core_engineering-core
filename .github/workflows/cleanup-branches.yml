name: Cleanup merged automation branches

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: engineering-core-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete closed automation branches already contained in main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t open_heads < <(gh pr list --state open --limit 500 --json headRefName --jq '.[].headRefName')
          is_open() {
            local candidate=$1
            local value
            for value in "${open_heads[@]}"; do
              [[ "$value" == "$candidate" ]] && return 0
            done
            return 1
          }
          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            case "$branch" in
              agent/*|recovery/*) ;;
              *) continue ;;
            esac
            if is_open "$branch"; then
              echo "keep open PR branch: $branch"
              continue
            fi
            remote="refs/remotes/origin/$branch"
            if ! git rev-parse --verify "$remote" >/dev/null 2>&1; then
              continue
            fi
            if git merge-base --is-ancestor "$remote" origin/main; then
              echo "delete merged branch: $branch"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            else
              echo "keep unmerged branch: $branch"
            fi
          done
