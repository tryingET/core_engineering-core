name: Auto release validated main version

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: engineering-core-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Resolve version and existing release state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python - <<'PY'
          import re
          from pathlib import Path
          match = re.search(r'^version\s*=\s*"([^"]+)"', Path('pyproject.toml').read_text(), re.M)
          if not match:
              raise SystemExit('missing project version')
          print(match.group(1))
          PY
          )
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Stop when the current release already exists
        if: steps.state.outputs.tag_exists == 'true' && steps.state.outputs.release_exists == 'true'
        run: echo "${{ steps.state.outputs.tag }} is already tagged and released."
      - name: Install project and run release proof
        if: steps.state.outputs.release_exists != 'true'
        run: |
          uv sync --locked
          uv run python scripts/check-release-lineage.py --mode ci
          uv run python scripts/release-local.py verify --version "${{ steps.state.outputs.version }}"
      - name: Create and push annotated tag
        if: steps.state.outputs.tag_exists != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.state.outputs.tag }}" -m "engineering-core ${{ steps.state.outputs.tag }}"
          git push origin "${{ steps.state.outputs.tag }}"
      - name: Validate tagged commit is contained in main
        if: steps.state.outputs.release_exists != 'true'
        run: |
          git fetch origin main --tags
          uv run python scripts/check-release-lineage.py \
            --mode release \
            --tag "${{ steps.state.outputs.tag }}" \
            --main-ref origin/main
      - name: Create GitHub Release with artifacts
        if: steps.state.outputs.release_exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(find docs/releases -maxdepth 1 -name "*-v${{ steps.state.outputs.version }}-local-release.md" -print -quit)
          test -n "$notes"
          gh release create "${{ steps.state.outputs.tag }}" \
            dist/*.whl dist/*.tar.gz \
            --title "engineering-core ${{ steps.state.outputs.tag }}" \
            --notes-file "$notes" \
            --verify-tag
