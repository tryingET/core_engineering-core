name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install project from lockfile
        run: uv sync --locked
      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v
      - name: Check catalog, projections, versions, and syntax
        run: uv run python -m engineering_core.self_check --repo-root .
      - name: Check stable-tag ancestry and monotonic version
        run: uv run python scripts/check-release-lineage.py --mode ci
      - name: Check lane addenda
        run: uv run python scripts/check-justfile-addenda.py
      - name: Check agent skill projection
        run: uv run python scripts/sync-skill-assets.py --check

  release-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install project from lockfile
        run: uv sync --locked
      - name: Run deterministic dogfood checks
        run: |
          uv run python scripts/dogfood-closed-loop.py
          uv run python scripts/dogfood-capabilities.py
          uv run python scripts/dogfood-evidence-reconcile.py
          uv run python scripts/dogfood-owner-use.py
      - name: Build and inspect release artifacts
        run: uv run python scripts/release-local.py verify

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Build distributions
        run: uv build
      - name: Install and exercise built wheel
        shell: bash
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          .venv-smoke/bin/engineering-core list >/dev/null
          .venv-smoke/bin/engineering-core list-disciplines >/dev/null
          .venv-smoke/bin/engineering-core list-templates >/dev/null
          .venv-smoke/bin/engineering-core check-self --repo-root . >/dev/null

  arch-linux-smoke:
    name: Arch Linux smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch runtime packages
        run: pacman -Syu --noconfirm --needed git python python-pip
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Report rolling platform versions
        run: |
          cat /etc/os-release
          python --version
      - name: Install uv in an isolated bootstrap environment
        run: |
          python -m venv /opt/uv-bootstrap
          /opt/uv-bootstrap/bin/python -m pip install --disable-pip-version-check uv
      - name: Install project from lockfile
        run: /opt/uv-bootstrap/bin/uv sync --locked
      - name: Run Arch compatibility checks
        run: |
          /opt/uv-bootstrap/bin/uv run python -m unittest discover -s tests -v
          /opt/uv-bootstrap/bin/uv run python -m engineering_core.self_check --repo-root .
          /opt/uv-bootstrap/bin/uv build
      - name: Install and exercise built wheel
        run: |
          python -m venv /tmp/engineering-core-wheel
          /tmp/engineering-core-wheel/bin/python -m pip install --disable-pip-version-check dist/*.whl
          /tmp/engineering-core-wheel/bin/engineering-core list >/dev/null
          /tmp/engineering-core-wheel/bin/engineering-core list-disciplines >/dev/null
          /tmp/engineering-core-wheel/bin/engineering-core check-self --repo-root . >/dev/null

  required:
    name: required
    if: always()
    needs: [validate, release-proof, package-smoke, arch-linux-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane
        shell: bash
        run: |
          test "${{ needs.validate.result }}" = success
          test "${{ needs.release-proof.result }}" = success
          test "${{ needs.package-smoke.result }}" = success
          test "${{ needs.arch-linux-smoke.result }}" = success
